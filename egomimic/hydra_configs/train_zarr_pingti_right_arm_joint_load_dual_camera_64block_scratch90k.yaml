defaults:
  - model: hpt_bc_so100_singlearm_joint_load_dual_camera_64block
  - visualization: so100_singlearm
  - paths: default
  - trainer: default
  - logger: debug
  - data: pingti_right_arm_joint_load_dual_camera
  - callbacks: checkpoints
  - data_schematic: so100_singlearm_joint_load_dual_camera
  - override hydra/launcher: basic
  - _self_

name: pingti_hpt
description: hpt_fm_pingti_right_arm_joint_load_dual_camera_full_64block_scratch90k
ckpt_path: null
init_from_checkpoint: null
init_from_checkpoint_strict: true
mode: train

hydra:
  run:
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}

seed: 42
reject_outliers: false
evaluator: null

model:
  scheduler:
    T_max: 90000

trainer:
  default_root_dir: ${hydra:runtime.output_dir}
  accelerator: gpu
  devices: 1
  precision: bf16
  max_epochs: -1
  min_epochs: 0
  max_steps: 90000
  min_steps: 0
  limit_train_batches: 1.0
  limit_val_batches: 0
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  deterministic: false

data:
  train_datasets:
    so100_singlearm:
      mode: train
      valid_ratio: 0.0
  valid_datasets:
    so100_singlearm:
      mode: total
      valid_ratio: 0.0
  train_dataloader_params:
    so100_singlearm:
      batch_size: 12
      num_workers: 2
  valid_dataloader_params:
    so100_singlearm:
      batch_size: 12
      num_workers: 1

logger:
  csv:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${paths.output_dir}
    name: csv

callbacks:
  model_checkpoint:
    filename: step_{step}
    auto_insert_metric_name: false
    save_top_k: -1
    save_last: true
    every_n_train_steps: 5000
    every_n_epochs: null

norm_stats:
  sample_frac: 1.0
  num_workers: 0
  save_cache_dir: ${hydra:runtime.output_dir}
  precomputed_norm_path: null
