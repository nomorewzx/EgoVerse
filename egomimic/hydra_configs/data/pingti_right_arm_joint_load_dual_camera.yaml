_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

train_datasets:
  so100_singlearm:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:PINGTI_HPT_JOINT_LOAD_ZARR_ROOT,/home/zxwang/egoverse-zarr/pingti-pick-apricot-0628-0629-joint-load}
      key_map:
        _target_: egomimic.rldb.embodiment.so100.So100SingleArm.get_keymap
        mode: joint_load_dual_camera
      transform_list:
        _target_: egomimic.rldb.embodiment.so100.So100SingleArm.get_transform_list
        mode: joint_load_dual_camera
        chunk_length: 100
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row.get('embodiment') == 'so100_singlearm'"
    mode: total
    valid_ratio: 0.0

valid_datasets:
  so100_singlearm:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:PINGTI_HPT_JOINT_LOAD_ZARR_ROOT,/home/zxwang/egoverse-zarr/pingti-pick-apricot-0628-0629-joint-load}
      key_map:
        _target_: egomimic.rldb.embodiment.so100.So100SingleArm.get_keymap
        mode: joint_load_dual_camera
      transform_list:
        _target_: egomimic.rldb.embodiment.so100.So100SingleArm.get_transform_list
        mode: joint_load_dual_camera
        chunk_length: 100
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row.get('embodiment') == 'so100_singlearm'"
    mode: total
    valid_ratio: 0.0

train_dataloader_params:
  so100_singlearm:
    batch_size: 2
    num_workers: 0

valid_dataloader_params:
  so100_singlearm:
    batch_size: 2
    num_workers: 0
