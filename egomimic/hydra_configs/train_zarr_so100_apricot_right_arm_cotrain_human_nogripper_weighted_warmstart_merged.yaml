defaults:
  - model: hpt_bc_so100_apricot_right_arm_cotrain_human_nogripper_weighted
  - visualization: so100_apricot_right_arm_cotrain
  - paths: default
  - trainer: default
  - logger: debug
  - data: so100_apricot_right_arm_cotrain_human_nogripper_merged
  - callbacks: checkpoints
  - data_schematic: so100_apricot_right_arm_cotrain
  - override hydra/launcher: basic
  - _self_

name: so100_apricot_cotrain
description: right_arm_human_nogripper_weighted0p2_warmstart_merged_part1_part2
ckpt_path: null
init_from_checkpoint: ${oc.env:SO100_APRICOT_COTRAIN_INIT_CKPT,/home/zxwang/repos/fork_egoverse/EgoVerse/logs/so100_apricot_cotrain/right_arm_human_nogripper_weighted0p2_2026-05-06_13-43-35/checkpoints/last.ckpt}
init_from_checkpoint_strict: true
mode: train

hydra:
  run:
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ./logs/${name}/${description}_${now:%Y-%m-%d_%H-%M-%S}

seed: 42
reject_outliers: false
evaluator: null

trainer:
  default_root_dir: ${hydra:runtime.output_dir}
  accelerator: gpu
  devices: 1
  precision: bf16
  max_epochs: -1
  min_epochs: 0
  max_steps: 50000
  min_steps: 0
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  deterministic: false

data:
  train_datasets:
    so100_singlearm:
      mode: train
      valid_ratio: 0.1
    ego_view_right_arm:
      mode: train
      valid_ratio: 0.1
  valid_datasets:
    so100_singlearm:
      mode: valid
      valid_ratio: 0.1
    ego_view_right_arm:
      mode: valid
      valid_ratio: 0.1
  train_dataloader_params:
    so100_singlearm:
      batch_size: 4
      num_workers: 8
    ego_view_right_arm:
      batch_size: 4
      num_workers: 8
  valid_dataloader_params:
    so100_singlearm:
      batch_size: 4
      num_workers: 4
    ego_view_right_arm:
      batch_size: 4
      num_workers: 4

model:
  optimizer:
    lr: 1e-4
  scheduler:
    T_max: 50000

logger:
  csv:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${paths.output_dir}
    name: csv

callbacks:
  model_checkpoint:
    filename: step_{step}
    auto_insert_metric_name: false
    save_top_k: -1
    save_last: true
    every_n_train_steps: 10000
    every_n_epochs: null

norm_stats:
  sample_frac: 1.0
  num_workers: 4
  save_cache_dir: ${hydra:runtime.output_dir}
  precomputed_norm_path: null
